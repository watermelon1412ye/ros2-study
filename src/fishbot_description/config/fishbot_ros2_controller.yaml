controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    # ========== 控制器类型声明 ==========
    # 注意：必须放在 controller_manager 的 ros__parameters 命名空间下。
    # 1) ROS2 --params-file 格式要求：顶层节点下只能有 ros__parameters 一个键，
    #    直接写 type 会报 "Cannot have a value before ros__parameters"。
    # 2) controller_manager 通过 get_parameter(<名字>.type) 在自己命名空间查找类型。

    fishbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fishbot_effort_controller:
      type: effort_controllers/JointGroupEffortController

    fishbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ========== 各控制器自身参数 ==========

# 关节状态广播控制器（清单6-62）
# 无需额外参数，自动发布所有状态接口

# 力控制器（清单6-70）
fishbot_effort_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
      - effort

# 两轮差速控制器（清单6-75）
fishbot_diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.20
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.032

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint

    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: true
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    use_stamped_vel: false
    #velocity_rolling_window_size: 10
